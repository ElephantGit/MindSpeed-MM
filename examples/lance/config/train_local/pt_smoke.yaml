D1:
  x2v_interleave_local:
    dataset_type: text2image_general
    raw_bytes_input: true
    is_image: true
    target_modality: image
    text_template: true
    task_type: t2v
    dataset_names:
      t2i_local_256:
        data_dir:
          - datasets/text2image/local_256.parquet
    debug_parquet_repeat: 256
    video_transform_args:
      resolution: 768
      mode: bucket
      divisible_crop_size: 16
      aspect_ratios: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
      mean: 0.5
      std: 0.5
    is_mandatory: false
    weight: 16
    caption_key: caption

D2:
  x2v_interleave_local:
    dataset_type: text2video_general
    raw_bytes_input: true
    is_image: false
    target_modality: video
    text_template: true
    task_type: [t2v, ff2v]
    task_type_rate: [0.8, 0.2]
    dataset_names:
      t2v_local_128:
        data_dir:
          - datasets/text2video/local_128.parquet
    debug_parquet_repeat: 256
    video_transform_args:
      resolution: 640
      mode: bucket
      divisible_crop_size: 16
      stride_spatial: 16
      stride_temporal: 4
      aspect_ratios: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
      mean: 0.5
      std: 0.5
    video_frame_sampler_args:
      type: multi_clips
      res_dump: ["12fps_360p"]
      params:
        temporal: 4
        sample_fps: 12
        max_duration: 6
        assert_seconds: false
        truncate: false
    is_mandatory: false
    weight: 64
    caption_key: caption

